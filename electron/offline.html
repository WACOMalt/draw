<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Draw</title>
    <style>
      body { margin: 0; height: 100vh; display: grid; place-items: center; background: #1d1d1d; color: #ddd; font: 14px system-ui, sans-serif; }
      .card { text-align: center; }
      button { margin-top: 14px; padding: 9px 22px; border: 0; border-radius: 6px; background: #1971c2; color: #fff; font: inherit; cursor: pointer; }
      p { color: #999; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Cannot reach the Draw server</h2>
      <p>Check the internet connection, then try again.</p>
      <button id="retry">Try again</button>
    </div>
    <script>
      const site = new URLSearchParams(location.search).get('site') || 'https://draw.bsums.xyz';
      document.getElementById('retry').onclick = () => (location.href = site);
    </script>
  </body>
</html>
