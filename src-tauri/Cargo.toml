[package]
name = "draw"
version = "0.2.0"
description = "Draw: shared infinite canvas (desktop app)"
edition = "2021"

[lib]
name = "draw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Pen pressure (src/pen.rs). Same versions as Tauri's own, so nothing is built twice.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSEvent"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "WKWebView"] }
block2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
