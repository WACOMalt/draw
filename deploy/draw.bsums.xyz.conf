# nginx site for draw.bsums.xyz on potato-vps1.
# Install: /etc/nginx/sites-available/draw.bsums.xyz, symlinked into sites-enabled/.
# Uses the existing *.bsums.xyz wildcard certificate. Proxies to draw.service on 127.0.0.1:3210.

server {
    listen 80;
    listen [::]:80;
    server_name draw.bsums.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name draw.bsums.xyz;

    ssl_certificate /etc/letsencrypt/live/bsums.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bsums.xyz/privkey.pem;

    # Opening a .bdraw file uploads it here. nginx allows 1 MB bodies by default; the server
    # checks its own 32 MB limit.
    location = /api/import {
        client_max_body_size 33m;
        proxy_pass http://127.0.0.1:3210;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5m;
    }

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # WebSockets stay open while people draw. The client pings every 25 s.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
