# nginx server block for draw.bsums.xyz -> Node on 127.0.0.1:3210 (pm2 app "draw").
# Install: copy to /etc/nginx/sites-available/ (or conf.d/), link it, then `nginx -t && systemctl reload nginx`.
# TLS: run `certbot --nginx -d draw.bsums.xyz`, or swap in the listen 443 / ssl_* lines your other
# subdomains use (for example a shared wildcard certificate).

map $http_upgrade $draw_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name draw.bsums.xyz;

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $draw_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Idle WebSockets stay open: the client pings every 25 s.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}
