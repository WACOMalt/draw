name: iOS

# Builds an unsigned .ipa of the iOS app (Tauri, the same app as Android) for sideloading: no
# Apple developer account is needed. AltStore, SideStore or Sideloadly sign it with the person's
# own Apple ID when they install it. Also builds the app for the iOS Simulator (a .zip of the
# .app, Apple silicon), to try it on appetize.io.
#
# Run by itself (Actions → iOS → Run workflow, or a pull request that changes the app shell),
# both files are downloads on the run. Called by the release workflow, they are also attached
# to the release.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/ios.yml
      - src-tauri/**
  workflow_call:
    inputs:
      version:
        description: App version (MAJOR.MINOR.PATCH)
        type: string
        required: true
      tag:
        description: Release to attach the files to
        type: string
        required: false

jobs:
  ipa:
    name: iOS (IPA)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # `tauri ios init` generates the Xcode project with XcodeGen.
      - run: brew install xcodegen || true
      - run: npm ci

      - name: Version
        run: |
          # A run by itself is a test build: x.y.0, older than every release, so the app offers
          # the real one.
          VERSION="${{ inputs.version }}"
          [ -n "$VERSION" ] || VERSION=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").0
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          node scripts/set-version.mjs "$VERSION"

      # src-tauri/gen/apple is generated here, not kept in the repository; src-tauri/Info.ios.plist
      # and tauri.conf.json (bundle.iOS, the .bdraw file type) carry the settings.
      - run: npx tauri ios init --ci

      - name: Build the app (unsigned)
        run: npx tauri ios build --ci --no-sign

      - name: Package the .ipa
        run: |
          ipa=$(find src-tauri/gen/apple/build -name '*.ipa' | head -1)
          test -n "$ipa" || { echo "::error::no .ipa"; exit 1; }
          ASSET="Draw_${VERSION}_ios.ipa"
          cp "$ipa" "$ASSET"
          ls -la "$ASSET"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      # For the iOS Simulator (appetize.io takes the .zip): the same app built for the Simulator.
      - name: Build the app for the Simulator
        id: sim
        continue-on-error: true
        run: |
          npx tauri ios build --ci --no-sign --target aarch64-sim
          app=$(find src-tauri/gen/apple/build -maxdepth 3 -path '*sim*' -name '*.app' | head -1)
          test -n "$app" || { echo "::error::no Simulator .app"; exit 1; }
          SIM_ASSET="Draw_${VERSION}_ios-simulator.zip"
          (cd "$(dirname "$app")" && zip -qry "$GITHUB_WORKSPACE/$SIM_ASSET" "$(basename "$app")")
          ls -la "$SIM_ASSET"
          echo "SIM_ASSET=$SIM_ASSET" >> "$GITHUB_ENV"

      - name: Keep the .ipa on the run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          retention-days: 14

      - name: Keep the Simulator build on the run
        if: env.SIM_ASSET != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SIM_ASSET }}
          path: ${{ env.SIM_ASSET }}
          retention-days: 14

      - name: Attach to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          files="$ASSET"
          [ -n "$SIM_ASSET" ] && files="$files $SIM_ASSET"
          for i in 1 2 3 4 5; do
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber $files && exit 0
            sleep 20
          done
          exit 1
