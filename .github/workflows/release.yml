# Every push to main publishes a release: the web/server bundle plus desktop installers for
# Linux, Windows and macOS, all built on GitHub's runners.
#
# Version: MAJOR.MINOR from package.json, PATCH = this workflow's run number. Bump MAJOR/MINOR
# in package.json by hand (node scripts/set-version.mjs 0.3.0) when you want to.
#
# The server updates itself from the latest release: bash /opt/draw/update-server.sh
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, in push order.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  # electron-builder downloads its own Electron; npm ci does not need the 100 MB binary.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  prepare:
    name: Check, build web, create draft release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes compare against the previous tag

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: version
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: node scripts/set-version.mjs ${{ steps.version.outputs.version }}
      - run: npm run check
      - run: npm run build
      - name: Server integration test (accounts, access, expiry)
        run: node tests/server.test.mjs

      - name: Package the web/server bundle
        run: |
          mkdir -p out/draw
          cp -r dist package.json package-lock.json ecosystem.config.cjs scripts/update-server.sh out/draw/
          cp -r deploy out/draw/deploy
          tar -czf draw-web.tar.gz -C out draw

      - name: Create the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > notes.md <<EOF
          ## Install

          | Platform | File |
          |---|---|
          | Linux (Fedora, RHEL) | \`Draw-$VERSION-1.x86_64.rpm\`: \`sudo dnf upgrade ./Draw-$VERSION-1.x86_64.rpm\` |
          | Linux (Debian, Ubuntu) | \`Draw_${VERSION}_amd64.deb\` |
          | Linux (any) | \`Draw_${VERSION}_amd64.AppImage\` |
          | Windows | \`Draw_${VERSION}_x64-setup.exe\` or \`.msi\`. Not signed yet: in SmartScreen, select **More info**, then **Run anyway**. |
          | macOS (Intel and Apple silicon) | \`Draw_${VERSION}_universal.dmg\`. Not signed yet: right-click the app, then **Open**. |
          | Android | \`Draw_${VERSION}_android.apk\`. Allow installs from your browser or file manager, then open the file. |

          **Server** (draw.bsums.xyz): \`bash /opt/draw/update-server.sh\`

          EOF
          gh release create "v$VERSION" draw-web.tar.gz \
            --draft --target "$GITHUB_SHA" \
            --title "Draw v$VERSION" \
            --notes-file notes.md --generate-notes
          # The desktop jobs upload to this id. An empty id makes them skip the upload silently,
          # so retry through GitHub API hiccups and fail loudly if it never appears.
          id=
          for i in 1 2 3 4 5 6; do
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"v$VERSION\") | .id" || true)
            [ -n "$id" ] && break
            sleep 10
          done
          [ -n "$id" ] || { echo "::error::draft release v$VERSION not found"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        # Linux is the Electron job below: WebKitGTK has no pen pressure and slow WebGL on NVIDIA.
        include:
          - name: Windows
            os: windows-latest
            args: ''
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci
      - run: node scripts/set-version.mjs ${{ needs.prepare.outputs.version }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}

  linux:
    name: Desktop (Linux, Electron)
    needs: prepare
    runs-on: ubuntu-22.04 # older glibc: the AppImage and .deb run on more distributions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: node scripts/set-version.mjs ${{ needs.prepare.outputs.version }}
      - run: npm run linux:build

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for i in 1 2 3 4 5; do
            gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber \
              "dist/electron/Draw_${VERSION}_amd64.AppImage" \
              "dist/electron/Draw_${VERSION}_amd64.deb" \
              "dist/electron/Draw-${VERSION}-1.x86_64.rpm" && exit 0
            sleep 20
          done
          exit 1

  android:
    name: Android (APK)
    needs: prepare
    runs-on: ubuntu-latest # has the Android SDK and NDK
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - run: npm ci
      - run: node scripts/set-version.mjs ${{ needs.prepare.outputs.version }}

      - name: Signing key (from secrets; the same key for every release, so updates install)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "password=$PASSWORD"
            echo "keyAlias=$ALIAS"
          } > src-tauri/gen/android/keystore.properties

      # arm64 and armv7 phones, x86_64 Chromebooks and emulators.
      - run: npx tauri android build --apk --target aarch64 armv7 x86_64

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' ! -name '*unsigned*' | head -1)
          test -n "$apk" || { echo "::error::no signed APK"; exit 1; }
          cp "$apk" "Draw_${VERSION}_android.apk"
          for i in 1 2 3 4 5; do
            gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber "Draw_${VERSION}_android.apk" && exit 0
            sleep 20
          done
          exit 1

  publish:
    name: Publish release
    needs: [prepare, desktop, linux, android]
    # Publish when the web bundle is ready, even if one desktop platform failed: the server
    # update must not wait for macOS. A failed platform shows red in the Actions run.
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5 6; do
            gh release edit "v${{ needs.prepare.outputs.version }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest && exit 0
            sleep 20
          done
          exit 1
